name: Bug report
description: Report a defect or unexpected behavior in this repository.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.5, Ubuntu 22.04, Windows 11
  - type: input
    id: runtime
    attributes:
      label: Runtime / framework version
      placeholder: e.g. PHP 8.4 + Laravel 13, Node 20 + Next 15
  - type: input
    id: browser
    attributes:
      label: Browser (if web)
      placeholder: e.g. Safari 17.4, Chrome 124
  - type: textarea
    id: other_tooling
    attributes:
      label: Other relevant tooling
      description: Optional. Any other context (database, CI, env vars) that matters.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or attach screenshots.
