name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The user problem, business need, or opportunity this would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: High-level description of what you want to build.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they were not chosen.
  - type: textarea
    id: open_questions
    attributes:
      label: Open questions
      description: Anything you'd like input on before scoping further.
