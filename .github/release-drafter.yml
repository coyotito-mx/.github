name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
      - 'refactor'
  - title: 'Documentation'
    labels:
      - 'docs'
      - 'documentation'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'chore'
      - 'maintenance'
      - 'refactor'
      - 'docs'
      - 'documentation'
  default: patch

exclude-labels:
  - 'skip-changelog'

autolabeler:
  - label: 'breaking'
    title:
      - '/^[a-z]+(\(.+\))?!:/i'
      - '/BREAKING[ -]CHANGE/'
    body:
      - '/BREAKING[ -]CHANGE/'
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:/i'
    branch:
      - '/^feat(ure)?\/.+/'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?:/i'
    branch:
      - '/^(bug)?fix\/.+/'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?:/i'
    branch:
      - '/^refactor\/.+/'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?:/i'
      - '/^build(\(.+\))?:/i'
      - '/^ci(\(.+\))?:/i'
      - '/^perf(\(.+\))?:/i'
      - '/^style(\(.+\))?:/i'
      - '/^test(\(.+\))?:/i'
    branch:
      - '/^chore\/.+/'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?:/i'
    branch:
      - '/^docs\/.+/'
    files:
      - '**/*.md'
      - 'docs/**'

template: |
  ## What's Changed

  $CHANGES
