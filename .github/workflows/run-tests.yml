name: Run Tests

on:
  workflow_call:
    inputs:
      php:
        description: 'JSON array of PHP versions to use. Defaults to `["8.4"]`.'
        default: '["8.4"]'
        type: string
      extensions:
        description: 'Extensions to pass to `shivammathur/setup-php`.'
        default: ''
        type: string
      tools:
        description: 'Tools to pass to `shivammathur/setup-php`.'
        default: 'composer:v2'
        type: string
      dependency-version:
        description: 'Composer dependency strategy: stable | lowest | highest.'
        default: 'stable'
        type: string
      for-laravel:
        description: 'Apply Laravel-specific setup (copy `.env.example` to `.env` and run `php artisan key:generate`) before tests.'
        default: false
        required: false
        type: boolean
      pest:
        default: true
        description: 'Run tests with Pest, fall back to PHPUnit if false'
        required: false
        type: boolean
      parallel:
        default: false
        description: 'Run tests in parallel (for Pest only)'
        required: false
        type: boolean
      working-directory:
        description: 'Directory to run commands in (e.g. a monorepo subdir like `apps/api`). Defaults to the repository root.'
        default: '.'
        required: false
        type: string
      flux:
        description: 'Configure Flux Pro Composer credentials (composer.fluxui.dev) before installing.'
        default: false
        required: false
        type: boolean
    secrets:
      FLUX_USERNAME:
        required: false
      FLUX_LICENSE_KEY:
        required: false

jobs:
  test:
    strategy:
      matrix:
        php: ${{ fromJson(inputs.php) }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          tools: ${{ inputs.tools }}

      - name: Configure Flux Pro credentials
        if: ${{ inputs.flux }}
        run: composer config --global http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ubuntu-latest-php-${{ matrix.php }}-composer-${{ inputs.dependency-version }}-${{ hashFiles('**/composer.lock') }}

      - name: Install PHP dependencies
        run: |
          case "${{ inputs.dependency-version }}" in
            lowest)
              composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction --optimize-autoloader
              ;;
            highest)
              composer update --prefer-stable --prefer-dist --no-progress --no-interaction --optimize-autoloader
              ;;
            *)
              composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader
              ;;
          esac

      - name: Copy `.env` file
        if: ${{ inputs.for-laravel }}
        run: cp .env.example .env

      - name: Generate application key
        if: ${{ inputs.for-laravel }}
        run: php artisan key:generate

      - name: Run with Pest
        if: ${{ inputs.pest }}
        run: vendor/bin/pest --ci ${{ inputs.parallel && '--parallel' || '' }}

      - name: Run with PHPUnit
        if: ${{ !inputs.pest }}
        run: vendor/bin/phpunit
