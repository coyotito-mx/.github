name: Release Drafter

on:
  workflow_call:
    secrets:
      token:
        required: true
        description: 'The token to use for authentication'

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
