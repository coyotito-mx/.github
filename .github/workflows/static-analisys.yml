name: static analysis

on:
  workflow_call:
    inputs:
      php:
        description: 'PHP version to use.'
        default: "8.4"
        type: string
      extensions:
        description: 'Extensions to pass to `shivammathur/setup-php` (e.g., `swoole, relay`).'
        default: ''
        type: string
      tools:
        description: 'Tools to pass to `shivammathur/setup-php`.'
        default: 'composer:v2'
        type: string
      dependency-version:
        description: 'Composer dependency strategy: stable | lowest | highest.'
        default: 'stable'
        type: string
      memory_limit:
        default: "1G"
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest

    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php }}
          extensions: ${{ inputs.extensions }}
          tools: ${{ inputs.tools }}
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            case "${{ inputs.dependency-version }}" in
              lowest)
                composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
                ;;
              highest|stable|*)
                composer update --prefer-stable --prefer-dist --no-interaction --no-progress
                ;;
            esac

      - name: Execute type checking
        run: vendor/bin/phpstan analyze --memory-limit="${{ inputs.memory_limit }}"
