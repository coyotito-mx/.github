name: Move major tag

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  move-major-tag:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR="${TAG%%.*}"
          if [[ ! "$MAJOR" =~ ^v[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match vN.N.N. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa "$MAJOR" -m "Update $MAJOR tag to $TAG" "$TAG"
          git push origin "$MAJOR" --force
