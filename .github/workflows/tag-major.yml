name: Move major tag

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  move-major-tag:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git and SSH signing
        env:
          SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
          SIGNER_NAME: ${{ vars.TAG_SIGNER_NAME }}
          SIGNER_EMAIL: ${{ vars.TAG_SIGNER_EMAIL }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SIGNING_KEY" > "$HOME/.ssh/tag_signing_key"
          chmod 600 "$HOME/.ssh/tag_signing_key"

          git config user.name  "$SIGNER_NAME"
          git config user.email "$SIGNER_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/tag_signing_key"
          git config tag.gpgSign true

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR="${TAG%%.*}"
          if [[ ! "$MAJOR" =~ ^v[0-9]+$ ]]; then
            echo "Tag '$TAG' does not match vN.N.N. Skipping."
            exit 0
          fi

          git tag -fs "$MAJOR" -m "Update $MAJOR tag to $TAG" "$TAG"
          git push origin "$MAJOR" --force
